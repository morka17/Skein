# docker compose up -d          # starts redis, api, and one worker
# docker compose up -d --scale worker=4   # run 4 worker processes instead of 1
#
# API:    http://localhost:8000  (docs at /docs, health at /health)
# Redis:  localhost:6379

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    command: ["python", "scripts/run_api.py"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env's default (localhost, meant for running the API
      # directly on the host) — inside compose's network, Redis is
      # reachable at the service name, not localhost.
      TASK_ENGINE_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    env_file:
      - .env
    environment:
      TASK_ENGINE_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # No fixed replica count here — `deploy.replicas` only applies under
    # `docker stack deploy` (Swarm). For plain `docker compose up`, scale
    # workers with: docker compose up -d --scale worker=4

volumes:
  redis_data: