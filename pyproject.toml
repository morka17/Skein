[project]
name = "skein-engine"
version = "0.1.0"
description = "A distributed task execution engine built on asyncio and Redis - priority scheduling, DAG-aware sub-task dependencies, and real-time execution monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Morka Joshua", email = "joshuamorka19@gmail.com" },
]
keywords = [
    "asyncio",
    "task-queue",
    "distributed-systems",
    "redis",
    "dag",
    "job-scheduler",
    "celery-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    # Core queue / worker / DAG engine
    "redis[hiredis]>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # API + real-time layer
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",

    # Structured logging
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "fakeredis>=2.21",       # in-memory Redis for unit tests
    "mypy>=1.9",
    "ruff>=0.3",
]
metrics = [
    "prometheus-client>=0.20",
]
postgres = [
    # optional durable persistence layer (persistence/db.py)
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
]

[project.urls]
Homepage = "https://github.com/morka17/skein"
Repository = "https://github.com/morka17/skein"
Issues = "https://github.com/morka17/skein/issues"

[project.scripts]
skein-worker = "task_engine.scripts.run_worker:main"
skein-api = "task_engine.scripts.run_api:main"

# ----------------------------------------------------------------------
# Build backend
# ----------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_engine"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=task_engine --cov-report=term-missing"

# ----------------------------------------------------------------------
# ruff (lint + format)
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ASYNC", # flake8-async — catches blocking calls inside async def
]

[tool.ruff.lint.isort]
known-first-party = ["task_engine"]

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["task_engine"]
mypy_path = "src"